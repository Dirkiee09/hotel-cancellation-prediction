name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Opt JavaScript actions into Node.js 24 immediately. GitHub will make this
# the default in June 2026 and remove Node.js 20 from runners in September
# 2026; this flag silences the deprecation warning until upstream actions
# publish their Node 24 major releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    # Pinned rather than ubuntu-latest so the cross-platform drift reported below
    # stays comparable from run to run.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
          pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests with coverage
        run: pytest

      # The committed artifacts and reports come from one Windows run. Check that
      # they agree with each other before this job retrains over them: the sync
      # check needs files from a single run, and after retraining only some of
      # them are regenerated here.
      - name: Committed results are mutually consistent
        run: python scripts/utils/check.py sync

      - name: Snapshot committed results
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp reports/metrics.json artifacts/thresholds.json "$RUNNER_TEMP/committed/"

      - name: Train production pipeline
        run: python scripts/training/train.py

      - name: Artifact consistency check
        run: python scripts/utils/check.py artifacts

      - name: Model metric gates
        run: python scripts/utils/check.py metrics

      # Retraining is byte-identical only on the environment recorded in
      # artifacts/model_metadata.json (see the reproduce-exact job). On Linux the
      # figures drift slightly, and LightGBM and XGBoost are close enough in
      # rolling-origin PR-AUC that the drift can change which one is selected.
      # Drift mode posts every difference as a run annotation and fails only if a
      # threshold-free score moves by more than 0.01, which would mean breakage.
      - name: Cross-platform drift from the committed results
        run: >-
          python scripts/utils/check.py reproduce --mode drift
          --baseline-dir "$RUNNER_TEMP/committed"

      - name: Algorithm fairness check (matched-capacity XGBoost vs LightGBM)
        run: python scripts/utils/check.py fairness

      - name: Security scan (bandit)
        run: bandit -q -r src scripts -s B101 -x tests

      - name: Dependency vulnerability scan (pip-audit)
        # Three Gradio advisories are accepted rather than fixed, and the
        # exception is deliberate: PYSEC-2026-211 has no fix version at all, so
        # upgrading cannot clear this gate. The other two need 6.15/6.16 — nine
        # minor releases on from the pinned 6.7.0, in the library that renders
        # the entire demo UI. All three concern a Gradio app reachable over a
        # network; this one is launched on localhost for a single operator and
        # is never exposed. Revisit after the conference: drop the ignores,
        # upgrade Gradio, and re-run the demo end to end.
        run: >-
          pip-audit -r requirements.txt --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-211
          --ignore-vuln PYSEC-2026-2178
          --ignore-vuln PYSEC-2026-2179

      - name: Upload quality-job artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: quality-debug-${{ github.run_id }}
          path: |
            artifacts/
            reports/
          if-no-files-found: ignore
          retention-days: 7

  # The committed results were produced on Windows with Python 3.12.10 and the
  # library versions in requirements.txt. On that environment a retrain must
  # reproduce every committed headline figure exactly.
  reproduce-exact:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt

      - name: Snapshot committed results
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp reports/metrics.json artifacts/thresholds.json "$RUNNER_TEMP/committed/"

      - name: Train production pipeline
        run: python scripts/training/train.py

      - name: Retrain reproduces the committed results exactly
        shell: bash
        run: >-
          python scripts/utils/check.py reproduce --mode exact
          --baseline-dir "$RUNNER_TEMP/committed"

  thesis-analysis:
    runs-on: ubuntu-24.04
    # Optuna alone may use its full 10-minute budget, and the benchmark took
    # 25 minutes single-threaded on a desktop; 60 left no margin.
    timeout-minutes: 90
    needs: quality
    # Runs on the default branch only, plus on demand. The repository has a
    # single branch, `master`; the earlier condition gated on `main`/`Main`,
    # which no longer exist, so this job silently never ran.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
          pip check

      - name: Train pipeline + thesis analysis
        run: python scripts/training/train.py --thesis

      - name: Generate benchmark tables
        run: python scripts/training/benchmark.py

      - name: Cross-artifact sync check
        run: python scripts/utils/check.py sync

      - name: Upload thesis reports
        uses: actions/upload-artifact@v5
        with:
          name: thesis-reports
          path: reports/thesis/
